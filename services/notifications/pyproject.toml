[project]
name = "notifications"
version = "0.1.0"
description = "Emails customers about their payments (SendGrid), alerts Slack about failed ones, and archives every email in S3."
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.5,<10",
    "aiohttp>=3.11,<4",
    "asyncpg>=0.30,<1",
    "boto3>=1.38,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["notifications"]

[tool.pytest.ini_options]
testpaths = ["tests"]
