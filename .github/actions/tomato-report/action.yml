name: tomato report
description: Put a service's black-box results and step coverage in one PR comment.
inputs:
  service:
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: "{coverage,blackbox-*}"
        path: reports
        merge-multiple: true

    - name: Write the report
      shell: bash
      run: |
        {
          echo "<!-- tomato-report:${{ inputs.service }} -->"
          echo "## 🍅 \`${{ inputs.service }}\`"
          echo
          cat reports/reports/results.md 2>/dev/null || cat reports/results.md 2>/dev/null || echo "### ❌ No black-box results"
          echo
          cat reports/coverage.md 2>/dev/null || echo "### ❌ No coverage report"
          echo
          echo "[Workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
        } > report.md
        cat report.md >> "$GITHUB_STEP_SUMMARY"

    - name: Comment on the pull request
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v9
      env:
        MARKER: "<!-- tomato-report:${{ inputs.service }} -->"
      with:
        script: |
          const body = require('fs').readFileSync('report.md', 'utf8');
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
          const mine = comments.find((c) => c.body.startsWith(process.env.MARKER));
          if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
          else await github.rest.issues.createComment({ owner, repo, issue_number, body });
