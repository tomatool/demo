name: notifications

# notifications (Python): build and unit-test it, then test the built artifact as
# a black box with tomato, and report the results with tomato's step coverage.
#
#   build ──────► blackbox ──┐
#                             ├──► report (job summary + PR comment)
#   coverage ─────────────────┘
#
# The build job builds notifications, and blackbox runs it under coverage.py and collects
# which of its code ran while tomato tested it.

on:
  push:
    branches: [main]
    paths:
      - 'services/notifications/**'
      - '.github/workflows/notifications.yml'
      - '.github/workflows/tomato-coverage.yml'
      - '.github/actions/**'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'services/notifications/**'
      - '.github/workflows/notifications.yml'
      - '.github/workflows/tomato-coverage.yml'
      - '.github/actions/**'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notifications
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/notifications/pyproject.toml
      - run: pip install -e '.[test]'
      - name: Unit tests
        run: python -m pytest
      - name: Build
        run: pip wheel --no-deps -w dist .
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            services/notifications/dist/

  coverage:
    uses: ./.github/workflows/tomato-coverage.yml
    with:
      service: services/notifications
      min-total: 18

  blackbox:
    needs: build
    runs-on: ubuntu-latest
    env:
      # The .pth hook below starts coverage.py in every Python process that
      # sees this, including the one tomato starts.
      COVERAGE_PROCESS_START: ${{ github.workspace }}/services/notifications/.coveragerc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: services/notifications/dist/
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Restore the build
        working-directory: services/notifications
        run: |
          mkdir -p coverage
          python -m venv .venv
          .venv/bin/pip install dist/*.whl coverage
          echo "import coverage; coverage.process_startup()" \
            > "$(.venv/bin/python -c 'import site; print(site.getsitepackages()[0])')/coverage-blackbox.pth"
      - uses: ./.github/actions/tomato-blackbox
        with:
          service: services/notifications
      - name: Collect code coverage
        if: always()
        working-directory: services/notifications
        run: |
          .venv/bin/coverage combine --rcfile=.coveragerc
          .venv/bin/coverage lcov --rcfile=.coveragerc -o coverage/lcov.info
      - uses: ./.github/actions/code-coverage
        if: always()
        with:
          service: services/notifications
          format: lcov
          report: coverage/lcov.info
          floor: 85

  report:
    needs: [coverage, blackbox]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tomato-report
        with:
          service: notifications
