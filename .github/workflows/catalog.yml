name: catalog

# catalog (Rust): build and unit-test it, then test the built artifact as
# a black box with tomato, and report the results with tomato's step coverage.
#
#   build ──────► blackbox ──┐
#                             ├──► report (job summary + PR comment)
#   coverage ─────────────────┘

on:
  push:
    branches: [main]
    paths:
      - 'services/catalog/**'
      - 'proto/**'
      - '.github/workflows/catalog.yml'
      - '.github/workflows/tomato-coverage.yml'
      - '.github/actions/**'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'services/catalog/**'
      - 'proto/**'
      - '.github/workflows/catalog.yml'
      - '.github/workflows/tomato-coverage.yml'
      - '.github/actions/**'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/catalog
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/catalog
      - run: cargo clippy --locked -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            services/catalog/target/release/catalog

  coverage:
    uses: ./.github/workflows/tomato-coverage.yml
    with:
      service: services/catalog
      min-total: 55

  blackbox:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: services/catalog/target/release/
      - name: Restore the build
        run: chmod +x services/catalog/target/release/catalog
      - uses: ./.github/actions/tomato-blackbox
        with:
          service: services/catalog

  report:
    needs: [coverage, blackbox]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tomato-report
        with:
          service: catalog
