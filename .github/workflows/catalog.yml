name: catalog

# catalog (Rust): build and unit-test it, then test the built artifact as
# a black box with tomato, and report the results with tomato's step coverage.
#
#   build ──────► blackbox ──┐
#                             ├──► report (job summary + PR comment)
#   coverage ─────────────────┘
#
# The build job builds catalog instrumented for coverage, and blackbox collects
# which of its code ran while tomato tested it.

on:
  push:
    branches: [main]
    paths:
      - 'services/catalog/**'
      - 'proto/**'
      - '.github/workflows/catalog.yml'
      - '.github/workflows/tomato-coverage.yml'
      - '.github/actions/**'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'services/catalog/**'
      - 'proto/**'
      - '.github/workflows/catalog.yml'
      - '.github/workflows/tomato-coverage.yml'
      - '.github/actions/**'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/catalog
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/catalog
      - run: cargo clippy --locked -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - name: Build, instrumented for coverage
        env:
          RUSTFLAGS: -C instrument-coverage
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            services/catalog/target/release/catalog

  coverage:
    uses: ./.github/workflows/tomato-coverage.yml
    with:
      service: services/catalog
      min-total: 55

  blackbox:
    needs: build
    runs-on: ubuntu-latest
    env:
      LLVM_PROFILE_FILE: ${{ github.workspace }}/services/catalog/coverage/catalog-%p-%m.profraw
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: services/catalog/target/release/
      - name: Restore the build
        run: chmod +x services/catalog/target/release/catalog && mkdir -p services/catalog/coverage
      # The LLVM tools that read the coverage, of the same stable Rust that
      # built the binary minutes ago.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: ./.github/actions/tomato-blackbox
        with:
          service: services/catalog
      - name: Collect code coverage
        if: always()
        working-directory: services/catalog
        run: |
          LLVM="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/host: //p')/bin"
          "$LLVM/llvm-profdata" merge -sparse coverage/*.profraw -o coverage/catalog.profdata
          "$LLVM/llvm-cov" export -format=lcov target/release/catalog \
            -instr-profile=coverage/catalog.profdata > coverage/lcov.info
      - uses: ./.github/actions/code-coverage
        if: always()
        with:
          service: services/catalog
          format: lcov
          report: coverage/lcov.info
          floor: 70
          exclude: (\.cargo/registry|/rustc/|/rustlib/|/target/)

  report:
    needs: [coverage, blackbox]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tomato-report
        with:
          service: catalog
