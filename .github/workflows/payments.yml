name: payments

# payments (Kotlin): build and unit-test it, then test the built artifact as
# a black box with tomato, and report the results with tomato's step coverage.
#
#   build ──────► blackbox ──┐
#                             ├──► report (job summary + PR comment)
#   coverage ─────────────────┘
#
# The build job builds payments, and blackbox runs it with the JaCoCo agent and collects
# which of its code ran while tomato tested it.

on:
  push:
    branches: [main]
    paths:
      - 'services/payments/**'
      - '.github/workflows/payments.yml'
      - '.github/workflows/tomato-coverage.yml'
      - '.github/actions/**'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'services/payments/**'
      - '.github/workflows/payments.yml'
      - '.github/workflows/tomato-coverage.yml'
      - '.github/actions/**'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payments
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests and build
        run: ./gradlew test installDist
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            services/payments/build/install/payments/

  coverage:
    uses: ./.github/workflows/tomato-coverage.yml
    with:
      service: services/payments
      min-total: 25

  blackbox:
    needs: build
    runs-on: ubuntu-latest
    env:
      JACOCO: "0.8.13"
      # Read by the start script; the agent writes coverage when the JVM exits.
      JAVA_OPTS: -javaagent:${{ github.workspace }}/jacoco/agent.jar=destfile=${{ github.workspace }}/services/payments/coverage/blackbox.exec,includes=demo.*
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: services/payments/build/install/payments/
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Restore the build
        run: chmod +x services/payments/build/install/payments/bin/payments
      - name: Get JaCoCo
        run: |
          mkdir -p jacoco
          curl -fsSL -o jacoco/agent.jar "https://repo1.maven.org/maven2/org/jacoco/org.jacoco.agent/$JACOCO/org.jacoco.agent-$JACOCO-runtime.jar"
          curl -fsSL -o jacoco/cli.jar "https://repo1.maven.org/maven2/org/jacoco/org.jacoco.cli/$JACOCO/org.jacoco.cli-$JACOCO-nodeps.jar"
      - uses: ./.github/actions/tomato-blackbox
        with:
          service: services/payments
      - name: Collect code coverage
        if: always()
        working-directory: services/payments
        run: |
          java -jar "$GITHUB_WORKSPACE/jacoco/cli.jar" report coverage/blackbox.exec \
            --classfiles build/install/payments/lib/payments.jar --sourcefiles src/main/kotlin \
            --xml coverage/jacoco.xml --quiet
      - uses: ./.github/actions/code-coverage
        if: always()
        with:
          service: services/payments
          format: jacoco
          report: coverage/jacoco.xml
          floor: 85

  report:
    needs: [coverage, blackbox]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tomato-report
        with:
          service: payments
