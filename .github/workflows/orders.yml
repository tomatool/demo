name: orders

# orders (Go): build and unit-test it, then test the built artifact as
# a black box with tomato, and report the results with tomato's step coverage.
#
#   build ──────► blackbox ──┐
#                             ├──► report (job summary + PR comment)
#   coverage ─────────────────┘
#
# The build job builds orders instrumented for coverage, and blackbox collects
# which of its code ran while tomato tested it.

on:
  push:
    branches: [main]
    paths:
      - 'services/orders/**'
      - 'proto/**'
      - '.github/workflows/orders.yml'
      - '.github/workflows/tomato-coverage.yml'
      - '.github/actions/**'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'services/orders/**'
      - 'proto/**'
      - '.github/workflows/orders.yml'
      - '.github/workflows/tomato-coverage.yml'
      - '.github/actions/**'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/orders
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/orders/go.mod
          cache-dependency-path: services/orders/go.sum
      - run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Build, instrumented for coverage
        run: CGO_ENABLED=0 go build -cover -o bin/orders .
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            services/orders/bin/orders

  coverage:
    uses: ./.github/workflows/tomato-coverage.yml
    with:
      service: services/orders
      min-total: 20

  blackbox:
    needs: build
    runs-on: ubuntu-latest
    env:
      GOCOVERDIR: ${{ github.workspace }}/services/orders/coverage/raw
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: services/orders/bin/
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/orders/go.mod
          cache: false
      - name: Restore the build
        run: chmod +x services/orders/bin/orders && mkdir -p "$GOCOVERDIR"
      - uses: ./.github/actions/tomato-blackbox
        with:
          service: services/orders
      - name: Collect code coverage
        if: always()
        working-directory: services/orders
        run: go tool covdata textfmt -i="$GOCOVERDIR" -o coverage/cover.out || true
      - uses: ./.github/actions/code-coverage
        if: always()
        with:
          service: services/orders
          format: go
          report: coverage/cover.out
          floor: 70
          exclude: /gen/

  report:
    needs: [coverage, blackbox]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tomato-report
        with:
          service: orders
